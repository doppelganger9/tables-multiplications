<h1>Les tables de multiplication</h1>
<app-menu></app-menu>
@if (modeAffichage$ | async) {
  <app-table-multiplication
    [nombre$]="nombreChoisi$"
  ></app-table-multiplication>
} @else {
  @if ((actionChoisie$ | async) === 'Réviser') {
    <app-revision-table [nombre$]="nombreChoisi$"></app-revision-table>
  } @else {
    <app-statistiques></app-statistiques>
  }
}
<app-footer></app-footer>
